<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="utf-8">
    <meta property="og:title" content="chairman椅人 - 想選市議員先給我來坐輪椅">
    <meta property="og:description" content="坐輪椅的人在你的選區！邀請 2026 年議員候選人坐上輪椅，親身體驗選區內的道路實況">
    <meta property="og:type" content="website">
    <title>chairman椅人 - 想選市議員先給我來坐輪椅</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #5b21b6;
            --primary-light: #8b5cf6;
            --primary-pale: #ede9fe;
            --accent: #f59e0b;
            --accent-dark: #d97706;
            --joined: #10b981;
            --joined-dark: #059669;
            --notyet: #94a3b8;
            --bg: #faf5ff;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: "Noto Sans TC", sans-serif;
            color: #1e1b4b;
            background: var(--bg);
        }

        .app-header {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background: linear-gradient(90deg, #312e81, var(--primary), var(--primary-light));
            color: #fff;
            gap: 10px;
            flex-shrink: 0;
        }
        .app-header h1 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-header .subtitle {
            font-size: 0.7rem;
            opacity: 0.85;
        }

        .stats-bar {
            display: flex;
            align-items: center;
            padding: 4px 16px;
            background: var(--primary-pale);
            border-bottom: 1px solid #c4b5fd;
            font-size: 0.82rem;
            gap: 16px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .stats-bar .stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stats-bar .stat b {
            color: var(--primary);
            font-size: 1rem;
        }
        .stats-bar .joined-count b {
            color: var(--joined-dark);
        }

        .map-wrap {
            position: relative;
            flex: 1;
            min-height: 0;
        }
        #map { position: absolute; inset: 0; }
        .leaflet-container { font-family: "Noto Sans TC", sans-serif; }

        .filter-btns {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            gap: 3px;
        }
        .filter-btns .fbtn {
            border: 2px solid var(--primary-light);
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 4px 10px;
            cursor: pointer;
            transition: all 0.15s;
            background: #fff;
            color: var(--primary);
        }
        .filter-btns .fbtn.active {
            background: var(--joined);
            border-color: var(--joined);
            color: #fff;
        }
        .filter-btns .fbtn:hover { opacity: 0.85; }

        .locate-btn {
            position: absolute;
            top: 80px;
            left: 10px;
            z-index: 1000;
            color: var(--primary);
        }

        .legend-box {
            position: absolute;
            bottom: 24px;
            left: 10px;
            z-index: 1000;
            background: rgba(255,255,255,0.94);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            line-height: 1.8;
        }
        .legend-box b { display: block; margin-bottom: 2px; }
        .legend-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            vertical-align: middle;
            margin-right: 4px;
        }

        .leaflet-tooltip { white-space: pre-line; max-width: 280px; }

        /* Candidate panel */
        .info-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 420px;
            max-width: 100%;
            height: 100%;
            background: #fff;
            z-index: 2000;
            display: none;
            flex-direction: column;
            box-shadow: -4px 0 24px rgba(0,0,0,0.15);
        }
        .info-panel.open { display: flex; }

        .info-panel-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: linear-gradient(90deg, #312e81, var(--primary));
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .info-panel-header .close-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 8px;
            line-height: 1;
        }

        .info-panel-body {
            overflow-y: auto;
            padding: 16px;
            flex: 1;
        }

        .cand-card {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            background: #f8f7ff;
            border: 1px solid #e0daf8;
            transition: background 0.15s;
        }
        .cand-card.is-joined {
            background: #ecfdf5;
            border-color: #a7f3d0;
        }
        .cand-card .cand-photo {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #ddd;
        }
        .cand-card .cand-info { flex: 1; min-width: 0; }
        .cand-card .cand-name { font-weight: 700; font-size: 1rem; }
        .cand-card .cand-party { font-size: 0.8rem; color: #555; }
        .cand-card .joined-badge {
            display: inline-block;
            background: var(--joined);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 9px;
            margin-left: 6px;
        }

        .embed-wrap {
            margin-top: 8px;
            border-radius: 8px;
            overflow: hidden;
            background: #f0f0f0;
        }
        .embed-wrap iframe {
            width: 100%;
            border: none;
            min-height: 300px;
        }

        .more-posts-btn {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 6px 12px;
            border: 2px solid var(--joined);
            border-radius: 8px;
            background: #ecfdf5;
            color: var(--joined-dark);
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        .more-posts-btn:hover {
            background: var(--joined);
            color: #fff;
        }

        .party-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
        }

        @media (max-width: 576px) {
            .info-panel { width: 100%; }
            .app-header h1 { font-size: 0.95rem; }
        }
    </style>
</head>

<body>
    <header class="app-header">
        <div>
            <h1>♿ chairman椅人</h1>
            <div class="subtitle">想選市議員先給我來坐輪椅！坐輪椅的人在你的選區</div>
        </div>
        <a href="https://www.youtube.com/@chairman1227" target="_blank" rel="noopener"
            style="margin-left:auto;color:#fff;font-size:0.8rem;opacity:0.85;text-decoration:none;white-space:nowrap;">@chairman1227</a>
    </header>
    <div class="stats-bar" id="statsBar">
        <span class="stat">選區 <b id="statZones">0</b></span>
        <span class="stat">候選人 <b id="statCandidates">0</b></span>
        <span class="stat joined-count">已坐輪椅 <b id="statJoined">0</b></span>
        <a href="#" class="stat" style="color:var(--joined-dark);font-weight:700;text-decoration:none;" onclick="showOverview();return false;">
            <i class="bi bi-grid-3x3-gap-fill"></i> 總覽
        </a>
        <a href="#" class="stat" style="color:var(--primary);font-weight:700;text-decoration:none;margin-left:auto;" onclick="showInvitationVideo();return false;">
            <i class="bi bi-play-circle-fill"></i> 看發起影片
        </a>
    </div>

    <div class="map-wrap">
        <div id="map"></div>

        <div class="filter-btns">
            <button class="fbtn active" id="filterJoined" onclick="toggleFilter()">
                <i class="bi bi-funnel-fill"></i> 僅顯示已坐輪椅
            </button>
        </div>

        <button class="btn btn-light btn-sm locate-btn shadow" onclick="locateUser()">
            <i class="bi bi-geo-alt-fill"></i>
        </button>

        <div class="legend-box">
            <b>圖例</b>
            <span class="legend-dot" style="background:#10b981;"></span>有候選人已坐輪椅<br>
            <span class="legend-dot" style="background:#8b5cf6;"></span>尚未有人坐輪椅<br>
            <span class="legend-dot" style="background:#cbd5e1;"></span>尚無候選人資料
        </div>
    </div>

    <!-- Invitation Video Modal -->
    <div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border:none;border-radius:14px;overflow:hidden;">
                <div class="modal-header" style="background:linear-gradient(90deg,#312e81,var(--primary));color:#fff;border-bottom:none;">
                    <h6 class="modal-title mb-0">♿ chairman椅人 — 發起影片</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <div style="position:relative;padding-bottom:177.78%;height:0;overflow:hidden;">
                        <iframe id="invitationIframe" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;" allowfullscreen loading="lazy"></iframe>
                    </div>
                    <div style="padding:12px 16px;">
                        <p style="margin:0;font-size:0.9rem;color:#4c1d95;">
                            想選市議員先給我來坐輪椅！坐輪椅的人在你的選區，邀請所有議員候選人坐上輪椅，親身體驗選區內的道路實況。
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="info-panel" id="infoPanel">
        <div class="info-panel-header">
            <span id="infoPanelTitle"></span>
            <button class="close-btn" id="closePanel">&times;</button>
        </div>
        <div class="info-panel-body" id="infoPanelBody"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-FJ1JR851SJ');

</body>

</html>
