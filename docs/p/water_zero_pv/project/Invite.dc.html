<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>水庫零光電宣言 邀請圖</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&amp;family=Noto+Serif+TC:wght@900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFD600}a:hover{color:#ffe866}
</style>
</helmet>
<div style="width: 1080px; height: 1080px; box-sizing: border-box; background: #0E2640; font-family: 'Noto Sans TC', sans-serif; color: #ffffff; padding: 72px 80px 0; display: flex; flex-direction: column">
  <span style="font-size: 28px; font-weight: 700; letter-spacing: 0.24em; color: {{accent}}">2026 參選人簽署中</span>
  <h1 style="margin: 18px 0 0; font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 128px; line-height: 1.08; letter-spacing: 0.02em">水庫<br>零光電宣言</h1>
  <p style="margin: 28px 0 0; font-size: 36px; font-weight: 700; line-height: 1.45">翡翠水庫可以拒絕，<br>每座民生水庫都可以。<br><span style="color: {{accent}}">你敢簽嗎？</span></p>
  <div style="margin-top: 48px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
    <div style="background: #17375c; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 22px; font-weight: 900; color: {{accent}}">STEP 1</span>
      <span style="font-size: 30px; font-weight: 900">下載宣言</span>
      <span style="font-size: 20px; line-height: 1.5; color: #d6dfea">列印 A4 簽署頁</span>
    </div>
    <div style="background: #17375c; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 22px; font-weight: 900; color: {{accent}}">STEP 2</span>
      <span style="font-size: 30px; font-weight: 900">簽名拍照</span>
      <span style="font-size: 20px; line-height: 1.5; color: #d6dfea">手持宣言入鏡</span>
    </div>
    <div style="background: #17375c; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 22px; font-weight: 900; color: {{accent}}">STEP 3</span>
      <span style="font-size: 30px; font-weight: 900">上傳標註</span>
      <span style="font-size: 20px; line-height: 1.5; color: #d6dfea">#水庫零光電</span>
    </div>
  </div>
  <div style="margin-top: auto; margin-left: -80px; margin-right: -80px; height: 100px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
    <span style="font-size: 36px; font-weight: 900; color: #0E2640">不分黨派｜九種選舉參選人皆可簽署</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFD600","options":["#FFD600","#FFFFFF","#7FD1FF"]},"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FFD600' };
  }
}
</script>
</body>
</html>
