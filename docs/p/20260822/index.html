    <style>
        :root {
            --primary: #dc3545;
            --primary-dark: #b02a37;
            --secondary: #fd7e14;
            --warm: #fff5f5;
            --dark: #2c1810;
            --cream: #fef9f0;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 56px;
            left: 0;
            right: 0;
            z-index: 1;
        }
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, var(--warm) 0%, var(--cream) 100%);
            border-top: 2px solid var(--secondary);
            z-index: 1000;
            padding: 8px 0;
        }
        .navbar .btn-primary-custom {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #fff;
            border-radius: 20px;
            font-weight: 500;
        }
        .navbar .btn-primary-custom:hover {
            background-color: var(--primary-dark);
            border-color: var(--primary-dark);
            color: #fff;
        }
        .navbar .btn-outline-custom {
            border-color: var(--primary);
            color: var(--dark);
            border-radius: 20px;
        }
        .navbar .btn-outline-custom:hover {
            background-color: var(--primary);
            color: #fff;
        }
        .navbar .form-control {
            border-radius: 20px;
            border-color: var(--secondary);
        }
        .navbar .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
        }
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            border: 2px solid var(--secondary);
        }
        .leaflet-popup-content {
            max-width: 350px;
            min-width: 320px;
            max-height: 70vh;
            overflow-y: auto;
            margin: 8px 12px;
        }
        .leaflet-popup-content .text-post-media {
            max-width: 100%;
        }
        .leaflet-popup-content iframe {
            max-width: 100% !important;
        }
        .popup-card .card-title {
            color: var(--dark);
        }
        .popup-card .btn-nav {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #fff;
            border-radius: 20px;
        }
        .popup-card .btn-nav:hover {
            background-color: var(--primary-dark);
        }
        .popup-card .btn-threads {
            background-color: #000;
            border-color: #000;
            color: #fff;
            border-radius: 20px;
        }
        .popup-card .btn-threads:hover {
            background-color: #333;
        }
        .marker-icon {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: 2px solid #fff;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 2px 8px rgba(44, 24, 16, 0.35);
        }
        .leaflet-control-zoom a {
            color: var(--dark) !important;
        }

                    <div class="input-group">

                        <input type="text" id="filter-input" class="form-control" placeholder="搜尋災情說明..." style="border-radius:0 20px 20px 0;">

                        </button>
                    </div>
